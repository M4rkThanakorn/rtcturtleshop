<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTC TurtleShop - สาขาสนามกีฬาแห่งชาติ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 font-sans pb-12">
  <header class="bg-emerald-600 text-white p-4 shadow-lg text-center font-bold text-xl">
    🐢 RTC TurtleShop - สาขาสนามกีฬาแห่งชาติ
  </header>

  <main class="max-w-4xl mx-auto m-4 p-4 bg-white rounded-xl shadow">
    <!-- Tab Navigation -->
    <div class="flex border-b mb-4 overflow-x-auto">
      <button onclick="switchTab('add-product')" class="tab-btn px-4 py-2 font-medium border-b-2 border-emerald-600 text-emerald-600">1. เพิ่มสินค้าหลัก</button>
      <button onclick="switchTab('add-rtc')" class="tab-btn px-4 py-2 font-medium text-slate-500">2. ทำ RTC</button>
      <button onclick="switchTab('view-rtc')" class="tab-btn px-4 py-2 font-medium text-slate-500">3. รายการ RTC ทั้งหมด</button>
      <button onclick="switchTab('report-rtc')" class="tab-btn px-4 py-2 font-medium text-slate-500">4. รายงานประจำวัน/เดือน</button>
      <button onclick="switchTab('view-expired')" class="tab-btn px-4 py-2 font-medium text-slate-500">5. สินค้าหมดอายุ</button>
    </div>

    <!-- 1. Form เพิ่มสินค้าหลัก -->
    <section id="add-product" class="tab-content">
      <h2 class="text-lg font-bold mb-4">เพิ่มสินค้าใหม่ลงฐานข้อมูล</h2>
      <form onsubmit="handleAddProduct(event)" class="space-y-4">
        <div>
          <label class="block mb-1 font-semibold">บาร์โค้ด</label>
          <input type="text" id="p-barcode" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="block mb-1 font-semibold">ชื่อสินค้า</label>
          <input type="text" id="p-name" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="block mb-1 font-semibold">ราคา (บาท)</label>
          <input type="number" step="0.01" id="p-price" required class="w-full border p-2 rounded">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold hover:bg-emerald-700">บันทึกสินค้าหลัก</button>
      </form>
    </section>

    <!-- 2. Form ทำ RTC -->
    <section id="add-rtc" class="tab-content hidden">
      <h2 class="text-lg font-bold mb-4">บันทึกการทำ RTC สินค้า</h2>
      <div class="space-y-4">
        <div class="flex gap-2">
          <input type="text" id="rtc-barcode" placeholder="กรอกหรือสแกนบาร์โค้ด" class="flex-1 border p-2 rounded">
          <button onclick="fetchProductInfo()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">ดึงข้อมูล</button>
        </div>

        <div id="scanner-container" class="hidden my-2">
          <div id="reader" width="100%"></div>
        </div>
        <button onclick="toggleScanner()" class="text-sm bg-slate-200 px-3 py-1 rounded">📷 สแกนผ่านกล้อง</button>

        <div class="border p-4 bg-slate-50 rounded space-y-2">
          <p><strong>ชื่อสินค้า:</strong> <span id="rtc-name-disp">-</span></p>
          <p><strong>ราคาเดิม:</strong> <span id="rtc-price-disp">-</span> บาท</p>
        </div>

        <div>
          <label class="block mb-1 font-semibold">จำนวนสินค้าที่พบ (ชิ้น)</label>
          <input type="number" id="rtc-qty" value="1" min="1" required class="w-full border p-2 rounded">
        </div>

        <div>
          <label class="block mb-1 font-semibold">วันหมดอายุ (Expiry Date)</label>
          <input type="date" id="rtc-expiry" required class="w-full border p-2 rounded">
        </div>
        <button onclick="handleSaveRTC()" class="w-full bg-emerald-600 text-white py-2 rounded font-bold hover:bg-emerald-700">บันทึกข้อมูล RTC</button>
      </div>
    </section>

    <!-- 3. ดูรายการ RTC ทั้งหมด -->
    <section id="view-rtc" class="tab-content hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">รายการ RTC ทั้งหมด (เรียงตามวันหมดอายุใกล้สุด)</h2>
        <button onclick="loadRTCData()" class="text-sm bg-slate-200 px-3 py-1 rounded">🔄 รีเฟรช</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse border">
          <thead>
            <tr class="bg-slate-100 border-b">
              <th class="p-2 border">บาร์โค้ด</th>
              <th class="p-2 border">ชื่อสินค้า</th>
              <th class="p-2 border text-center">จำนวน</th>
              <th class="p-2 border">วันหมดอายุ</th>
              <th class="p-2 border">เหลือ (วัน)</th>
              <th class="p-2 border">สถานะ</th>
            </tr>
          </thead>
          <tbody id="rtc-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 4. รายงานประจำวัน/เดือน -->
    <section id="report-rtc" class="tab-content hidden">
      <h2 class="text-lg font-bold mb-4">รายงานสินค้าที่ต้องดำเนินการ RTC</h2>
      <div id="report-container" class="space-y-4"></div>
    </section>

    <!-- 5. ดูสินค้าที่หมดอายุแล้ว -->
    <section id="view-expired" class="tab-content hidden">
      <h2 class="text-lg font-bold mb-4 text-red-600">รายการสินค้าหมดอายุแล้ว</h2>
      <div id="expired-container" class="space-y-2"></div>
    </section>
  </main>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbweGODp6bYKEhqrCNM6a6hX-cx-MCt4Iy7tRZqqBQIG5nDMiHuuAdeoDtfpvmjYiJVJ/exec"; // วาง URL Web App จาก Apps Script

    let currentProduct = null;
    let html5QrcodeScanner = null;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');
      if(tabId === 'view-rtc' || tabId === 'report-rtc' || tabId === 'view-expired') loadRTCData();
    }

    async function handleAddProduct(e) {
      e.preventDefault();
      const payload = {
        action: "addProduct",
        barcode: document.getElementById('p-barcode').value,
        name: document.getElementById('p-name').value,
        price: document.getElementById('p-price').value
      };
      const res = await fetch(GAS_WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      alert(data.message);
      e.target.reset();
    }

    async function fetchProductInfo() {
      const barcode = document.getElementById('rtc-barcode').value;
      if(!barcode) return alert("กรุณากรอกบาร์โค้ด");
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getProductByBarcode&barcode=${barcode}`);
      const data = await res.json();
      if(data.status === "success") {
        currentProduct = data.product;
        document.getElementById('rtc-name-disp').innerText = data.product.name;
        document.getElementById('rtc-price-disp').innerText = data.product.price;
      } else {
        alert("ไม่พบข้อมูลสินค้านี้ในฐานข้อมูลหลัก");
      }
    }

    async function handleSaveRTC() {
      if(!currentProduct) return alert("กรุณาดึงข้อมูลสินค้าก่อน");
      const expiryDate = document.getElementById('rtc-expiry').value;
      const quantity = document.getElementById('rtc-qty').value;
      
      if(!expiryDate) return alert("กรุณาระบุวันหมดอายุ");
      if(!quantity || quantity < 1) return alert("กรุณาระบุจำนวนสินค้าอย่างน้อย 1 ชิ้น");

      const payload = {
        action: "addRTC",
        barcode: currentProduct.barcode,
        name: currentProduct.name,
        price: currentProduct.price,
        quantity: Number(quantity),
        expiryDate: expiryDate
      };
      const res = await fetch(GAS_WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      alert(data.message);
      document.getElementById('rtc-expiry').value = '';
      document.getElementById('rtc-qty').value = '1';
    }

    async function loadRTCData() {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getRTCList`);
      const data = await res.json();
      if(data.status !== "success") return;

      const items = data.items;
      
      // Render Table (Tab 3)
      const tbody = document.getElementById('rtc-table-body');
      tbody.innerHTML = items.map(i => `
        <tr class="border-b">
          <td class="p-2 border">${i.barcode}</td>
          <td class="p-2 border">${i.name}</td>
          <td class="p-2 border text-center font-semibold">${i.quantity}</td>
          <td class="p-2 border">${i.expiryDate}</td>
          <td class="p-2 border font-bold ${i.daysLeft < 0 ? 'text-red-600' : ''}">${i.daysLeft} วัน</td>
          <td class="p-2 border"><span class="px-2 py-1 rounded text-xs text-white ${getStatusColor(i.status)}">${i.actionNeeded}</span></td>
        </tr>
      `).join('');

      // Render Report (Tab 4)
      const actionItems = items.filter(i => i.status === 'RTC_30' || i.status === 'RTC_50');
      document.getElementById('report-container').innerHTML = actionItems.length === 0 ? '<p>ไม่มีสินค้าต้องทำ RTC ในขณะนี้</p>' : actionItems.map(i => `
        <div class="p-4 border rounded bg-amber-50 flex justify-between items-center">
          <div>
            <p class="font-bold text-lg">${i.name} (${i.barcode})</p>
            <p class="text-sm text-slate-600">จำนวน: <span class="font-bold">${i.quantity}</span> ชิ้น | หมดอายุ: ${i.expiryDate} (เหลือ ${i.daysLeft} วัน)</p>
          </div>
          <span class="px-3 py-1 font-bold rounded text-white ${getStatusColor(i.status)}">${i.actionNeeded}</span>
        </div>
      `).join('');

      // Render Expired (Tab 5)
      const expiredItems = items.filter(i => i.status === 'EXPIRED');
      document.getElementById('expired-container').innerHTML = expiredItems.length === 0 ? '<p class="text-slate-500">ไม่มีสินค้าหมดอายุ</p>' : expiredItems.map(i => `
        <div class="p-4 border rounded bg-red-50 flex justify-between items-center">
          <div>
            <p class="font-bold">${i.name} (${i.barcode})</p>
            <p class="text-sm text-red-600">จำนวน: <span class="font-bold">${i.quantity}</span> ชิ้น | หมดอายุเมื่อ: ${i.expiryDate}</p>
          </div>
          <button onclick="deleteRTCItem('${i.id}')" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">ลบออกจากระบบ</button>
        </div>
      `).join('');
    }

    async function deleteRTCItem(id) {
      if(!confirm("ยืนยันการลบรายการนี้ใช่หรือไม่?")) return;
      const res = await fetch(GAS_WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "deleteRTC", id: id }) });
      const data = await res.json();
      alert(data.message);
      loadRTCData();
    }

    function getStatusColor(status) {
      if(status === 'EXPIRED') return 'bg-red-600';
      if(status === 'RTC_50') return 'bg-orange-600';
      if(status === 'RTC_30') return 'bg-yellow-500';
      return 'bg-emerald-600';
    }

    function toggleScanner() {
      const container = document.getElementById('scanner-container');
      container.classList.toggle('hidden');
      if (!container.classList.contains('hidden')) {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render((decodedText) => {
          document.getElementById('rtc-barcode').value = decodedText;
          fetchProductInfo();
          html5QrcodeScanner.clear();
          container.classList.add('hidden');
        });
      }
    }
  </script>
</body>
</html>
